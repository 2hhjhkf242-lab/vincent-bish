var l=document.createElement('link');l.rel='manifest';l.href='manifest.webmanifest'+(k?'?k='+encodeURIComponent(k):'');document.head.appendChild(l)})();</script>
<title>Second Chair</title>
<link rel="stylesheet" href="reset.css"><link rel="stylesheet" href="reveal.css">
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="deck.css"><link rel="stylesheet" href="attention.css">
<style>
/* Second Chair phone controller: portrait, one hand. */
:root{--bg:#191919;--surf:#272727;--surf2:#303030;--line:#393939;--ink:#F2F2F2;--mute:#9A9A9A;--dim:#6E6E6E;
 --amber:#D6A54A;--cherry:#E5484D;--crimson:#B51D37;--accent:#E8E8E8;
 --t-hypo:#2E6B47;--t-adv:#B3202A;--t-nuke:#4E0B16;--t-nuke-icon:#FF5C66;--t-evid:#303030;
 --pad:12px;--gap:8px;--tile-h:clamp(76px,9.2dvh,88px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:500 15px/1.3 'Inter',system-ui,sans-serif;font-variant-numeric:tabular-nums;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column;height:100dvh;padding:calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + var(--pad)) calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + var(--pad));gap:10px;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;height:28px;color:var(--mute);font-size:12.5px}
.top .l,.top .r{display:flex;align-items:center;gap:12px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);display:inline-block;margin-right:6px}
.on .dot{background:#3DBE7A}.off .dot{background:var(--cherry)}
.wake{display:flex;align-items:center;gap:5px}.wake svg{width:15px;height:15px}.wake.on{color:var(--ink)}
.more{width:44px;height:44px;margin-right:-12px;display:grid;place-items:center;color:var(--ink)}
.preview{position:relative;width:100%;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:#000;flex:none}
.preview .reveal{position:absolute;inset:0;pointer-events:none}
.ident{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;min-height:44px}
.ttl{font-size:17px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{font-size:13px;color:var(--mute);display:flex;gap:8px;align-items:center}
.tag{font-size:11px;font-weight:600;color:var(--ink);background:var(--surf2);border-radius:5px;padding:2px 6px;visibility:hidden}
.tag.show{visibility:visible}
.segs{flex:none;display:flex;gap:4px;height:4px}
.segs i{flex:1;border-radius:2px;background:#3A3A3A}.segs i.f{background:var(--accent)}
.timing{flex:none;background:var(--surf);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.count{font-size:38px;font-weight:650;letter-spacing:-.5px;line-height:1}
.count small{font-size:13px;font-weight:600;color:var(--mute);margin-left:8px;letter-spacing:0}
.count.amber{color:var(--amber)}.count.cherry{color:var(--cherry)}.count.over{color:var(--crimson)}
.paused .count{opacity:.45}
.pill{display:none;font-size:11px;font-weight:700;letter-spacing:.6px;color:#191919;background:var(--amber);border-radius:5px;padding:2px 6px;margin-left:8px;vertical-align:middle}
.paused .pill{display:inline-block}
.play{width:52px;height:44px;border-radius:11px;background:var(--surf2);display:grid;place-items:center;font-weight:650;font-size:14px}
.play.start{width:auto;padding:0 16px;background:var(--accent);color:#141414}
.pace{grid-column:1/-1;display:grid;grid-template-columns:72px 1fr auto;gap:8px;align-items:center;font-size:13px;color:var(--mute)}
.pace b{font-weight:600;color:var(--ink);text-align:right;min-width:88px}
.bar{height:3px;border-radius:2px;background:#3A3A3A;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ink);border-radius:2px}
.lv1 b{color:var(--amber)}.lv1 .bar i{background:var(--amber)}.lv2 b{color:var(--cherry)}.lv2 .bar i{background:var(--cherry)}.lv3 b{color:var(--crimson)}.lv3 .bar i{background:var(--crimson)}
.detour{grid-column:1/-1;font-size:12px;color:var(--mute);height:15px}
.grid{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:var(--tile-h);gap:var(--gap)}
.tile{border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 5px;text-align:center;color:#fff;font-size:12px;font-weight:600;line-height:1.15;position:relative}
.tile svg{width:26px;height:26px;flex:none}
.tile span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile.hypothetical{background:var(--t-hypo)}.tile.adversarial{background:var(--t-adv)}.tile.evidence{background:var(--t-evid)}
.tile.nuclear{background:var(--t-nuke)}.tile.nuclear svg{color:var(--t-nuke-icon)}
.tile.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.tile:active{filter:brightness(1.15)}
.tile.empty{background:#1F1F1F}
.spacer{flex:1 1 auto;min-height:0}
.turns{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.turns button{height:30px;border-radius:15px;background:var(--surf);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--mute);position:relative}
.turns button::after{content:'';position:absolute;inset:-7px -3px}
.turns button.on{color:#141414;background:#8ACFFF;border-color:#8ACFFF}
.rbctl{flex:none;display:none;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--mute);background:var(--surf);border-radius:12px;padding:8px 10px}
.rbctl.on{display:flex}.rbctl input{flex:1;accent-color:#B51D37;height:28px}.rbctl button{font:inherit;color:var(--ink);background:var(--surf2);border:0;border-radius:8px;padding:6px 8px}
.wrapup{position:absolute;left:6px;top:6px;z-index:3;display:none;align-items:baseline;gap:6px;padding:4px 9px;border-radius:7px;background:rgba(181,29,55,.94);color:#fff;font-size:13px;font-weight:700;letter-spacing:.01em;pointer-events:none}
.wrapup.on{display:flex}.wrapup small{font-size:11.5px;font-weight:600;opacity:.85;font-variant-numeric:tabular-nums}
.fill{font-variant-numeric:tabular-nums}.fill b{color:var(--ink);font-weight:700}.fill.hot b{color:#EFD375}
.identRow{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px}
.ret{flex:none;height:40px;padding:0 12px;border-radius:10px;background:var(--surf);border:1px solid var(--line);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;visibility:hidden}
.ret.show{visibility:visible}
.dpad{position:absolute;right:6px;bottom:6px;z-index:5;display:grid;grid-template-columns:repeat(3,36px);grid-template-rows:36px 36px;gap:4px;padding:0;background:none}
.dpad button{position:relative;border-radius:9px;background:rgba(40,40,40,.82);display:grid;place-items:center;color:var(--ink)}
.dpad button:active{background:rgba(80,80,80,.95)}
.dpad .u{grid-column:2;grid-row:1}.dpad .lt{grid-column:1;grid-row:2}.dpad .d{grid-column:2;grid-row:2}.dpad .rt{grid-column:3;grid-row:2;background:var(--accent);color:#141414}
.dpad svg{width:18px;height:18px}
.dpad button::after{content:'';position:absolute;inset:-4px}
.cue{flex:none;background:var(--surf);border-radius:14px;padding:10px 10px 10px 12px;display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;height:96px;position:relative}
.cue .ear{width:20px;height:20px;color:#8A8A8A;margin-top:2px}
.cue .ear.other{color:#8ACFFF}
.cards{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;touch-action:pan-x}
.cards::-webkit-scrollbar{display:none}
.card{flex:0 0 100%;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:center;gap:3px;font-size:15px;font-weight:500;line-height:1.4;color:#EFD375;min-width:0}
.card div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .hinge{color:#8ACFFF}.card .anchor{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.card.none{color:var(--dim)}
.pager{position:absolute;right:10px;bottom:6px;font-size:10.5px;color:var(--dim)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end}
.sheet.open{display:flex}
.panel{width:100%;background:var(--surf);border-radius:18px 18px 0 0;padding:16px calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 16px);display:flex;flex-direction:column;gap:6px}
.panel h3{margin:0 0 6px;font-size:13px;color:var(--mute);font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;min-height:48px;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border:0}
.step{display:flex;gap:6px;align-items:center}.step button{width:44px;height:36px;border-radius:9px;background:var(--surf2);font-size:18px}
.danger{color:var(--cherry)}
.help{font-size:13px;color:var(--mute);line-height:1.45}
</style></head>
<body>
<div class="top">
  <div class="l"><span id="conn" class="off"><span class="dot"></span><span id="connT">Connecting</span></span><span class="fill" id="fill" title="Fillers counted only in bursts: 3 or more within 5 seconds">Fillers <b id="fillN">0</b></span></div>
  <div class="r"><button class="wake" id="wake" aria-label="Screen stays awake"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 5h3"/></svg><span id="wakeT">Sleep on</span></button>
  <button class="more" id="more" aria-label="More"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button></div>
</div>
<div class="preview"><div class="reveal"><div class="slides" id="slides"></div></div>
  <div class="wrapup" id="wrap">Wrap it up<small id="wrapT"></small></div>
  <div class="dpad">
    <button class="u" data-c="up" aria-label="Up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg></button>
    <button class="lt" data-c="prev" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <button class="d" data-c="down" aria-label="Down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
    <button class="rt" data-c="next" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
  </div>
</div>
<div class="identRow"><div class="ident"><div class="ttl" id="ttl">&nbsp;</div><div class="pos"><span id="pos"></span><span class="tag" id="tag">Rebuttal</span></div></div>
  <button class="ret" id="ret"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Return to slide</button>
</div>
<div class="segs" id="segs"></div>
<div class="timing" id="timing">
  <div class="count" id="count">30:00<span class="pill">PAUSED</span></div>
  <button class="play start" id="play">Start</button>
  <div class="pace" id="pSl"><span id="slN" style="white-space:nowrap">Slide</span><div class="bar"><i></i></div><b id="slT">0:00 / 0:00</b></div>
</div>
<div class="cue"><svg class="ear" id="ear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8.5a6.5 6.5 0 1 1 13 0c0 6-6 6-6 10a3.5 3.5 0 1 1-7 0"/><path d="M15 8.5a2.5 2.5 0 0 0-5 0v1a2 2 0 1 1 0 4"/></svg><div class="cards" id="cards"></div><span class="pager" id="pager"></span></div>
<div class="spacer"></div>
<div class="rbctl" id="rbctl"><span>Case by case</span><input id="rbr" type="range" min="0" max="1" step="0.001" value="0.3" aria-label="Review model"><span>By exception</span><button id="rbreset" type="button">Reset</button></div>
<div class="turns" id="turns"><button data-k="question">Question</button><button data-k="objection">Objection</button><button data-k="followup">Follow-up</button><button data-k="smalltalk">Small talk</button></div>
<div class="grid" id="grid"></div>

<div class="sheet" id="sheet"><div class="panel">
  <h3>Session</h3>
  <div class="row"><span>Length</span><span class="step"><button data-dur="-5">−</button><b id="dur">30 min</b><button data-dur="5">+</button></span></div>
  <div class="row"><span>Reserve for interruptions</span><span class="step"><button data-res="-5">−</button><b id="res">10%</b><button data-res="5">+</button></span></div>
  <div class="row"><button id="replay">Replay this slide</button></div>
  <div class="row"><button id="reset" class="danger">Reset session</button><span class="help" id="resetH"></span></div>
  <div class="row"><a id="log" class="help" style="color:var(--ink)" target="_blank">Rehearsal log (planned vs actual)</a></div>
  <div class="row help" id="install">To install: open this page in Safari, tap Share, then Add to Home Screen.</div>
  <div class="row"><button id="close">Done</button></div>
</div></div>
<script src="edition.js"></script>
<script src="reveal.js"></script><script src="deck-data.js"></script><script src="reducer.js"></script><script src="fillers.js"></script>
<script src="att-render.js"></script><script src="sync.js"></script>
<script>
(function () {
const R = PresenterReducer, D = DECK, $ = (id) => document.getElementById(id);
const fmt = (ms) => { const neg = ms < 0, s = Math.floor(Math.abs(ms) / 1000); return (neg ? '+' : '') + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const S = PresenterSync(); AttRender.setClock(S.now);
const SLOT = { hypothetical: [0, 1], adversarial: [2, 3], evidence: [4, 5], nuclear: [6, 7] };
let deck = null, shownSlide = null, gridFor = null, wl = null, presenting = false;

/* preview: the same slides, rendered from the same session state */
fetch('slides.html').then(r => r.text()).then(html => {
  $('slides').innerHTML = html;
  deck = new Reveal(document.querySelector('.preview .reveal'), { embedded: true, width: 1920, height: 1080, margin: 0, minScale: .05, maxScale: 1,
    controls: false, progress: false, slideNumber: false, hash: false, keyboard: false, touch: false, overview: false, transition: 'none', backgroundTransition: 'none', center: false, navigationMode: 'grid', scrollActivationWidth: null, view: null });
  deck.initialize().then(() => { shownSlide = null; paint(S.state, true); });
});

function paint(s, force) {
  const home = s.origin || s.current, reb = s.origin ? D.rebuttals[s.current] : null;
  if (deck) {
    const sec = document.getElementById(s.current), moved = shownSlide !== s.current;
    if (sec && moved) { const i = deck.getIndices(sec); deck.slide(i.h, i.v); shownSlide = s.current; }
    if (D.att[home]) AttRender.render(document.getElementById(home), D.att[home], R.slideState(s, home), moved || force);
  }
  $('ttl').textContent = '“' + (reb ? reb.title : D.titles[home]) + '”';
  $('pos').textContent = 'Slide ' + D.number[home] + ' of ' + D.numberTotal;
  $('tag').classList.toggle('show', !!reb);
  $('tag').textContent = reb ? 'Rebuttal' : '';
  const n = R.stagesOf(D, home), st = R.slideState(s, home), segs = $('segs');
  const want = Math.max(1, n);
  if (segs.children.length !== want) segs.innerHTML = '<i></i>'.repeat(want);
  const filled = n ? (st.done ? n : st.stage) : 1;
  [...segs.children].forEach((el, i) => el.classList.toggle('f', i < filled));
  if (gridFor !== home) buildGrid(home);
  document.querySelectorAll('.tile[data-id]').forEach(t => t.classList.toggle('sel', t.dataset.id === s.current));
  $('ret').classList.toggle('show', !!s.origin);
  const tk = s.hold ? s.hold.kind : (s.turn && (S.now() - s.turn.at < 20000) ? s.turn.kind : null);
  document.querySelectorAll('#turns button').forEach((b) => b.classList.toggle('on', b.dataset.k === tk));
  cues(s, home);
  const c = s.clock;
  $('play').className = 'play' + (c.started ? '' : ' start');
  $('play').textContent = !c.started ? 'Start' : (c.running ? 'Pause' : 'Resume');
  $('timing').classList.toggle('paused', c.started && !c.running);
  $('dur').textContent = Math.round(c.durationMs / 60000) + ' min'; $('res').textContent = c.reservePct + '%';
  document.querySelectorAll('[data-dur]').forEach(b => b.disabled = c.started);
  $('conn').className = S.connected ? 'on' : 'off'; $('connT').textContent = S.connected ? 'Linked' : (window.SC_STATIC ? 'Demo on this device' : 'Not linked'); if (window.SC_STATIC) $('conn').className = 'on';
  tick();
}
function buildGrid(home) {
  gridFor = home;
  const col = D.columns[D.columnOf[home]], ids = col.rows.filter(id => id !== home), slots = new Array(8).fill(null);
  ids.forEach(id => { const r = D.rebuttals[id]; const pref = SLOT[r.cls] || [4, 5]; const free = pref.find(i => !slots[i]); const any = slots.findIndex(x => !x);
    const at = free !== undefined ? free : any; if (at > -1) slots[at] = id; });
  const rows = slots.slice(4).some(Boolean) ? 8 : (ids.length ? 4 : 4);
  $('grid').innerHTML = slots.slice(0, 8).map(id => {
    if (!id) return '<div class="tile empty" aria-hidden="true"></div>';
    const r = D.rebuttals[id];
    return `<button class="tile ${r.cls}" data-id="${id}" aria-label="${r.question.replace(/"/g, '&quot;')}">${r.icon}<span>${r.title}</span></button>`;
  }).join('');
}
/* cue cards: exact spans from the semantic objects; the card you are touching is never swapped under you */
const esc = (t) => t.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
let cueKey = null, cueTouch = false;
function cues(s, home) {
  const all = (D.cues && D.cues[home]) || [], st = R.slideState(s, home), stage = st.done ? -1 : st.stage;
  const rank = (c) => c.stages.indexOf(stage) > -1 ? 0 : (c.stages.length ? 2 : 1);
  const list = all.map((c, i) => [rank(c), i, c]).sort((a, b) => a[0] - b[0] || a[1] - b[1]).map((x) => x[2]);
  const key = home + ':' + list.map((c) => c.id).join(',');
  if (key === cueKey || cueTouch) return;
  cueKey = key;
  const box = $('cards');
  box.innerHTML = list.length ? list.map((c) => '<div class="card" data-id="' + c.id + '">' + c.lines.map((t, i) => {
    const hs = c.hingeSpan, us = c.underlineSpan;
    if (i !== hs.line) return '<div>' + esc(t) + '</div>';
    return '<div>' + esc(t.slice(0, hs.start)) + '<span class="hinge">' + esc(t.slice(hs.start, us.start)) + '<span class="anchor">' + esc(t.slice(us.start, us.end)) + '</span>' + esc(t.slice(us.end, hs.end)) + '</span>' + esc(t.slice(hs.end)) + '</div>';
  }).join('') + '</div>').join('') : '<div class="card none"><div>No cue card for this slide yet</div></div>';
  box.scrollLeft = 0; pager();
}
function pager() { const box = $('cards'), n = box.children.length; $('pager').textContent = n > 1 ? (Math.round(box.scrollLeft / box.clientWidth) + 1) + ' / ' + n : ''; }
$('cards').addEventListener('scroll', pager, { passive: true });
$('cards').addEventListener('touchstart', () => { cueTouch = true; }, { passive: true });
$('cards').addEventListener('touchend', () => { setTimeout(() => { cueTouch = false; }, 4000); }, { passive: true });
/* never zoom: block pinch and double-tap zoom everywhere */
['gesturestart', 'gesturechange', 'dblclick'].forEach((ev) => document.addEventListener(ev, (e) => e.preventDefault(), { passive: false }));
function level(ms, budget) { const r = budget ? ms / budget : 0; return r >= 1.25 ? 3 : r >= 1 ? 2 : r >= .8 ? 1 : 0; }
function tick() {
  const s = S.state, L = R.live(D, s, S.now()), B = R.budgets(D, s), c = s.clock, home = s.origin || s.current;
  const cnt = $('count'); cnt.firstChild.nodeValue = fmt(L.remaining);
  cnt.className = 'count' + (L.remaining < 0 ? ' over' : L.remaining <= 120000 ? ' cherry' : L.remaining <= 300000 ? ' amber' : '');
  const set = (id, el, used, budget) => { const lv = level(used, budget); el.className = 'pace' + (lv ? ' lv' + lv : '');
    el.querySelector('b').textContent = fmt(used) + ' / ' + fmt(budget); el.querySelector('.bar i').style.width = Math.min(100, budget ? used / budget * 100 : 0) + '%'; };
  set('sl', $('pSl'), L.slide, B.slides[home]);
  $('slN').textContent = L.held ? 'Held: ' + ({ question: 'question', objection: 'objection', followup: 'follow-up', rebuttal: 'rebuttal' })[L.hold] : 'Slide';
  const sb = B.sections[L.sectionId] || 0, over = L.own - sb;      // own time only: questions and rebuttals never count
  const wrap = c.started && sb > 0 && over > 0 && !L.held;
  $('wrap').classList.toggle('on', wrap); if (wrap) $('wrapT').textContent = '+' + fmt(over);
  const fn = (s.fillers && s.fillers.total) || 0; $('fillN').textContent = fn;
  const last = (s.log || []).filter(x => x.kind === 'filler').pop(); $('fill').classList.toggle('hot', !!last && S.now() - last.at < 8000);
}
setInterval(tick, 250);
S.onChange((s) => paint(s));
/* review-model slider: phone control plus mirror into the preview's iframe */
let rbLast, rbT = 0, rbP, rbTouch = false;
const rbFrames = () => [...document.querySelectorAll('iframe.rb-frame')];
S.onChange((s) => { const v = (s.vars || {}).rbI; $('rbctl').classList.toggle('on', s.current === 'rbI');
  if (!rbTouch) $('rbr').value = v === undefined ? 0.3 : v;
  if (v !== rbLast) { rbLast = v; rbFrames().forEach(f => f.contentWindow && f.contentWindow.postMessage({ rbSet: v === undefined ? null : v }, '*')); } });
window.addEventListener('message', (e) => { const d = e.data; if (!d || typeof d !== 'object') return; if (d.rbReady) { const v = (S.state.vars || {}).rbI; e.source && e.source.postMessage({ rbSet: v === undefined ? null : v }, '*'); } });
$('rbr').addEventListener('pointerdown', () => { rbTouch = true; }); addEventListener('pointerup', () => { rbTouch = false; });
$('rbr').addEventListener('input', () => { rbP = +$('rbr').value; if (!rbT) rbT = setTimeout(() => { rbT = 0; S.send('setVar', { k: 'rbI', v: rbP }); }, 60); });
$('rbreset').addEventListener('click', () => S.send('setVar', { k: 'rbI', v: null }));
document.addEventListener('visibilitychange', () => { if (!document.hidden) { paint(S.state, true); if (presenting && !wl) wake(); } });

/* controls */
document.querySelectorAll('[data-c]').forEach(b => b.addEventListener('click', () => S.send(b.dataset.c)));
$('grid').addEventListener('click', (e) => { const t = e.target.closest('.tile[data-id]'); if (t) S.send('goto', { id: t.dataset.id }); });
$('ret').addEventListener('click', () => S.send('return'));
$('turns').addEventListener('click', (e) => { const b = e.target.closest('button[data-k]'); if (b) S.send('tag', { kind: b.dataset.k }); });
$('play').addEventListener('click', () => { const c = S.state.clock;
  if (!c.started) { S.send('start'); presenting = true; wake(); } else S.send(c.running ? 'pause' : 'resume'); });
$('wake').addEventListener('click', () => { presenting = true; wake(); });
$('more').addEventListener('click', () => { $('sheet').classList.add('open'); $('log').href = 'api/log?k=' + encodeURIComponent(localStorage.getItem('presenter-key') || ''); });
$('close').addEventListener('click', () => $('sheet').classList.remove('open'));
$('sheet').addEventListener('click', (e) => { if (e.target.id === 'sheet') $('sheet').classList.remove('open'); });
document.querySelectorAll('[data-dur]').forEach(b => b.addEventListener('click', () => S.send('setDuration', { min: Math.round(S.state.clock.durationMs / 60000) + (+b.dataset.dur) })));
document.querySelectorAll('[data-res]').forEach(b => b.addEventListener('click', () => S.send('setReserve', { pct: S.state.clock.reservePct + (+b.dataset.res) })));
$('replay').addEventListener('click', () => { S.send('replay'); $('sheet').classList.remove('open'); });
let armed = 0;
$('reset').addEventListener('click', () => {
  if (Date.now() - armed < 3000) { S.send('reset', { confirm: 'RESET' }); armed = 0; $('resetH').textContent = ''; $('sheet').classList.remove('open'); if (wl) wl.release(); presenting = false; return; }
  armed = Date.now(); $('resetH').textContent = 'Tap again within 3 seconds to clear the whole session';
  setTimeout(() => { if (Date.now() - armed >= 3000) $('resetH').textContent = ''; }, 3100);
});

/* screen wake lock: indicator shows only what the system actually granted */
function wakeUI(state) { const w = $('wake'); w.classList.toggle('on', state === 'on');
  $('wakeT').textContent = state === 'on' ? 'Awake' : state === 'unsupported' ? 'Wake lock unavailable' : state === 'denied' ? 'Wake lock refused' : 'Sleep on'; }
async function wake() {
  if (!('wakeLock' in navigator)) return wakeUI('unsupported');
  try { wl = await navigator.wakeLock.request('screen'); wakeUI('on');
    wl.addEventListener('release', () => { wl = null; wakeUI('off'); }); }
  catch (e) { wl = null; wakeUI('denied'); }
}
wakeUI('wakeLock' in navigator ? 'off' : 'unsupported');
if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});
if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) $('install').textContent = 'Installed on the Home Screen.';
})();
</script>
</body></html>
